org.gradle.jvmargs=-Xmx16g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
# Isolated Projects currently fails when the DBFlow compiler plugin is applied
# (IntelliJ write-action / Extensions.getRootArea NPE during KMP configuration).
org.gradle.isolated-projects=false

android.useAndroidX=true

bt_gitUrl=https\://github.com/agrosner/DBFlow.git
bt_licenseName=The MIT License
bt_licenseUrl=http\://opensource.org/licenses/MIT
bt_repo=Libraries
bt_siteUrl=https\://github.com/agrosner/DBFlow
dbflow_build_tools_version=26.0.2
dbflow_min_sdk=4
dbflow_min_sdk_rx=15
dbflow_project_prefix=\:
dbflow_target_sdk=26
group=com.dbflow5
kotlin.incremental=false
version=5.0.0-alpha2
version_code=1

kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
